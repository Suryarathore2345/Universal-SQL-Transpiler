# Render Blueprint — deploys both services from this one repo.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting this repo on Render (New > Blueprint), Render reads this
# file and creates both services below. Free tier for both — the backend
# spins down after ~15 min idle and cold-starts on the next request.

services:
  - type: web
    name: ust-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://ust-frontend.onrender.com

  - type: web
    name: ust-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        value: https://ust-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
